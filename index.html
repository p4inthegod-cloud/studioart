<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lavender Studio</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:wght@600&display=swap" rel="stylesheet">

<style>
body {
  margin:0;
  font-family: Inter, sans-serif;
  background: linear-gradient(180deg,#fbf8ff,#eee6f4);
  color:#2e2340;
}

.container {
  max-width:1200px;
  margin:auto;
  padding:20px;
}

/* HEADER */
.header {
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.logo {
  font-family:'Playfair Display', serif;
  font-size:32px;
  color:#5f418e;
}

/* HERO */
.hero {
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:40px;
  align-items:center;
  margin-top:40px;
}

.hero h1 {
  font-size:56px;
  line-height:1;
}

.hero p {
  color:#6b5d81;
  margin-top:20px;
}

.btn {
  margin-top:20px;
  padding:16px 24px;
  border-radius:12px;
  border:none;
  font-weight:700;
  cursor:pointer;
}

.btn-primary {
  background:#6d45a6;
  color:white;
}

.btn-secondary {
  background:white;
  border:1px solid #ddd;
}

/* VISUAL */
.visual {
  position:relative;
  height:500px;
}

.card {
  position:absolute;
  border-radius:20px;
  overflow:hidden;
  box-shadow:0 20px 40px rgba(0,0,0,0.1);
}

.card img {
  width:100%;
}

.card1 {width:240px; top:0; left:100px;}
.card2 {width:120px; top:80px; right:0;}
.card3 {width:180px; bottom:0; left:0;}
.card4 {width:240px; bottom:0; right:80px;}

@media(max-width:768px){
  .hero {
    grid-template-columns:1fr;
  }
  .visual {
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
    height:auto;
  }
  .card {
    position:static;
    width:100%;
  }
}
</style>
</head>

<body>

<div class="container">

<div class="header">
<div class="logo">LAVENDER STUDIO</div>
<button class="btn btn-secondary">Обсудить</button>
</div>

<section class="hero">

<div>
<h1>Дизайн, который помогает продавать</h1>
<p>Упаковка, логотипы и карточки товара, которые выглядят дорого и вызывают доверие</p>

<button class="btn btn-primary">Написать в Telegram</button>
<button class="btn btn-secondary">Портфолио</button>
</div>

<div class="visual">
<div class="card card1"><img src="assets/lavere-card.png"></div>
<div class="card card2"><img src="assets/aurora-box.png"></div>
<div class="card card3"><img src="assets/serum-card.png"></div>
<div class="card card4"><img src="assets/lunea-board.png"></div>
</div>

</section>

</div>

</body>
</html>
